[project]
name = "aioshad-py"
version = "0.1.0"
description = "Modern, fast, fully asynchronous Python framework & self-bot library for Shad Messenger."
authors = [
    { name = "Amin Madani", email = "aminmadani112@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
keywords = ["shad", "messenger", "selfbot", "asyncio", "aioshad", "bot", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "h2>=4.0.0",
    "cryptography>=42.0.0",
    "Pillow>=10.0.0",
    "aiofiles>=23.1,<25.0",
    "colorama>=0.4.6,<1.0",
    "pydantic>=2.0,<3.0",
    "typing_extensions>=4.0,<5.0",
    "magic-filter>=1.0,<2.0",
    "socksio>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
aioshad = "aioshad.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/aminmadaniofficial/aioshad"
"Repository" = "https://github.com/aminmadaniofficial/aioshad"
"PyPI" = "https://pypi.org/project/aioshad-py/"

[tool.setuptools.packages.find]
include = ["aioshad*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
