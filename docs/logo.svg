<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Outer glowing hexagon -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           fill="#0E131F" 
           stroke="url(#brand-grad)" 
           stroke-width="3" 
           filter="url(#shadow)" />
  <!-- Inner cyber lines -->
  <polygon points="50,14 80,31 80,69 50,86 20,69 20,31" 
           fill="none" 
           stroke="url(#glow-grad)" 
           stroke-width="1" 
           stroke-dasharray="4,4" 
           opacity="0.6" />
  <!-- Central Stylized Telegram/Shad Rocket/Bolt Emblem -->
  <path d="M50 24 L72 68 L50 56 L28 68 Z" fill="url(#brand-grad)" />
  <path d="M50 24 L50 56 L72 68 Z" fill="#60A5FA" opacity="0.4" />
  <!-- Center Core Pulsing Dot -->
  <circle cx="50" cy="54" r="3.5" fill="#FFFFFF" />
</svg>
