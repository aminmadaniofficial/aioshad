name: Docs & Site

# Deploy results:
#   https://aminmadaniofficial.github.io/aioshad/            <- docs/mainpage.html (Landing page)
#   https://aminmadaniofficial.github.io/aioshad/document/   <- Sphinx documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "aioshad/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aioshad + docs deps
        run: python -m pip install -e ".[docs]"

      - name: Build Sphinx
        run: sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Assemble _site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/document _site/_static

          if [ ! -f docs/mainpage.html ]; then
            echo "::error::docs/mainpage.html not found"; exit 1
          fi
          cp docs/mainpage.html _site/index.html

          cp -R docs/_build/html/. _site/document/

          if [ ! -f docs/_static/logo.svg ]; then
            echo "::error::docs/_static/logo.svg not found"; exit 1
          fi
          cp docs/_static/logo.svg _site/_static/logo.svg

          touch _site/.nojekyll

      - name: Check links from the landing page
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while read -r p; do
            case "$p" in */) p="${p}index.html" ;; esac
            if [ ! -f "_site/$p" ]; then
              echo "::error::Broken link in mainpage.html -> $p"; missing=1
            fi
          done < <(grep -oE 'href="document/[^"#]*"' docs/mainpage.html | sed -E 's/^href="(.*)"$/\1/' | sort -u)
          [ "$missing" -eq 0 ]

          echo "--- _site ---";          ls -la _site
          echo "--- _site/document ---"; ls -la _site/document | head -n 10

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
